name: python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "contract/**"
      - "fixtures/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "contract/**"
      - "fixtures/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  check:
    name: test and package (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked --all-extras --python python
      - run: uv run --locked --all-extras ruff check .
      - run: uv run --locked --all-extras ruff format --check .
      - run: uv run --locked --all-extras mypy
      - run: uv run --locked --all-extras pytest --cov=traceport --cov-report=term-missing
      - run: uv run --locked --all-extras python -m compileall -q examples
      - run: uv build
      - run: uv run --locked --all-extras twine check dist/*
      - run: uv run --locked --all-extras python scripts/check_package.py dist/*.whl
