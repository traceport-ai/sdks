name: go

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "contract/**"
      - "fixtures/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - "contract/**"
      - "fixtures/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: go

jobs:
  check:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverpkg=.,./workflows/...,./internal/... ./...
      - run: go build ./...
