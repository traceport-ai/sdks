version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
