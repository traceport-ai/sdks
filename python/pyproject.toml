[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "traceport-ai"
dynamic = ["version"]
description = "Official Python SDK for the Traceport API: one shared client and per-product modules."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shineport Innovations Private Limited" }]
keywords = ["traceport", "workflows", "ai", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.urls]
Homepage = "https://github.com/traceport-ai/sdks/tree/main/python#readme"
Repository = "https://github.com/traceport-ai/sdks"
Issues = "https://github.com/traceport-ai/sdks/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=2.4.1,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "twine>=6,<8",
]

[tool.hatch.version]
path = "src/traceport_ai/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/traceport_ai"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples"]

[tool.coverage.run]
source = ["traceport_ai"]
branch = true
